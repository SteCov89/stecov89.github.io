<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Contatti · Pineta Tennis &amp; Padel</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body>
<div id="chrome-header"></div>
<main>
<div class="page-hero"><div class="wrap"><span class="eyebrow">Contatti</span><h1>Vieni a trovarci</h1></div></div>
<section class="first"><div class="wrap"><div class="contact">
<div class="rows" id="rows"></div>
<div class="panel"><h3 style="margin-bottom:.8rem">Orari di apertura</h3><div class="hours" id="hours"></div>
<p class="note">Per corsi, tesseramento e noleggio campi per gruppi, scrivi o chiama la segreteria. Indirizzo e recapiti sono segnaposto.</p></div>
</div></div></section>
</main>
<div id="chrome-footer"></div>
<script src="data.js"></script>
<script src="app.js"></script>

<script>
(function(){ "use strict"; var App=window.App,h=App.h,$=App.$,C=window.CLUB;
App.chrome("contatti.html");
var rows=$("#rows");
[["Indirizzo",C.address,false],["Telefono segreteria",C.phone,true],["Email",C.email,true],["Presidente ASD",C.president,false]].forEach(function(r){
 var row=h("div",{class:"row"},[h("div",{},[h("span",{class:"k",text:r[0]}),h("span",{class:"v",text:r[1]})])]);
 if(r[2]){var b=h("button",{type:"button",class:"copy",text:"Copia"});b.addEventListener("click",function(){App.copy(r[1],b);});row.appendChild(b);}
 rows.appendChild(row);});
C.hours.forEach(function(r){$("#hours").appendChild(h("div",{},[h("span",{text:r[0]}),h("span",{text:r[1]})]));});
})();
</script>
</body></html>
